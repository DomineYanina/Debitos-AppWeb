name: CI - Integracion Continua y Validacion

on:
  push:
  pull_request:

jobs:
  # ==========================================
  # VALIDACION DEL FRONTEND ANGULAR
  # ==========================================
  frontend-check:
    name: Frontend (Build & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Debitos-AppWeb/debitos-frontend
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Debitos-AppWeb/debitos-frontend/package-lock.json

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Compilar Frontend (Angular Production Build)
        run: npm run build -- --configuration production

      - name: Ejecutar Tests Unitarios del Frontend
        run: npm test -- --watch=false

  # ==========================================
  # VALIDACION DEL BACKEND SPRING BOOT
  # ==========================================
  backend-check:
    name: Backend (Compile & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Debitos-AppWeb
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: Debitos-AppWeb/pom.xml

      - name: Compilar y ejecutar Tests con Maven (H2 in-memory)
        run: mvn clean test
