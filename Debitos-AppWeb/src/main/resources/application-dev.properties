# Configuracion para desarrollo local
# Este perfil se activa automaticamente al correr mvn spring-boot:run sin parametros adicionales

# ===============================
# CONEXION A POSTGRESQL LOCAL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/Debitos
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# HIBERNATE / JPA (modo desarrollo)
# ===============================
spring.jpa.show-sql=true
