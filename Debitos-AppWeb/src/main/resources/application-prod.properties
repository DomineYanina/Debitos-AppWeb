# src/main/resources/application-prod.properties

# Conexión a Base de Datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Seguridad y Autenticación
jwt.secret=${JWT_SECRET}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://172.16.14.210,http://localhost:4200}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Prevención de Time-outs y Gestión de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=45000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=60000
# Statement timeout en PostgreSQL para cancelar consultas colgadas y liberar conexiones
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '60s'

# Timeout JPA / Hibernate alineado con statement_timeout
spring.jpa.properties.jakarta.persistence.query.timeout=60000

