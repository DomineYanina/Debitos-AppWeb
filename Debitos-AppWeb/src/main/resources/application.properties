spring.application.name=backend

# ===============================
# PERFIL ACTIVO POR DEFECTO
# En produccion, sobreescribir con: SPRING_PROFILES_ACTIVE=prod
# ===============================
spring.profiles.active=dev

# ===============================
# CONFIGURACION DE SEGURIDAD Y JWT
# ===============================
jwt.secret=${JWT_SECRET:TuClaveSuperSecretaQueNadieDebeConocerParaElTPI2026}
jwt.expiration=1800000
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://172.16.14.210}

# ===============================
# CONFIGURACION DE HIBERNATE / JPA
# ===============================
# Imprime las consultas SQL en la consola (ideal para ver que hace por detras)
spring.jpa.show-sql=true

# CRITICO: Como ya tenes la base de datos creada de tu app en C#,
# usamos "none" para que Spring Boot NO intente borrar, recrear o alterar tus tablas automaticamente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# CONFIGURACION DE BATCH (RENDIMIENTO)
# ===============================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ===============================
# GESTION DE CONEXIONES (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=5
# 60s: evita ERR_CONNECTION_TIMED_OUT bajo carga pico (era 20s, muy agresivo)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
# 90s: elimina falsos positivos con consultas legitimamente lentas (era 15s)
spring.datasource.hikari.leak-detection-threshold=90000
# Mantiene las conexiones del pool activas y detecta conexiones muertas
spring.datasource.hikari.keepalive-time=60000
# CRITICO ANTI-LEAK: configura statement_timeout en PostgreSQL para cada nueva
# conexion. Si una consulta supera los 120s, PostgreSQL la cancela automaticamente
# y libera la conexion. Esto blinda el pool contra consultas "colgadas".
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '120s'

# ===============================
# TIMEOUT JPA / HIBERNATE
# ===============================
# Timeout de 120s tambien a nivel JPA (alineado con el statement_timeout de PG)
spring.jpa.properties.jakarta.persistence.query.timeout=120000

# ===============================
# CONFIGURACION FUNCIONAL AUDITORIA
# ===============================
app.auditoria.permitir-nc-conjunta=true